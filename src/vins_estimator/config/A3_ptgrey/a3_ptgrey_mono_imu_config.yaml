# VINS-Fusion algorithm configuration (ROS 2 parameter YAML).
# Passed to the nodes through the `config_file` parameter or `--params-file`.
/**:
  ros__parameters:
    imu: 1
    num_of_cam: 1
    imu_topic: "/djiros/imu"
    image0_topic: "/stereo/left/image"
    image1_topic: "/stereo/right/image"
    output_path: "./output/"
    cam0_calib: "left.yaml"
    cam1_calib: "right.yaml"
    image_width: 640
    image_height: 512
    estimate_extrinsic: 0
    body_T_cam0: [
      -0.026001622181574202, -0.00520858729097301, -0.9996483312957406, -0.12886997952961168,
      0.9996548156677538, 0.0036294078574090616, -0.026020701583033656, -0.12147595522352593,
      0.0037636626038181076, -0.999979848805483, 0.005112418876396019, 0.03288156119127258,
      0.0, 0.0, 0.0, 1.0]
    multiple_thread: 1
    max_cnt: 150
    min_dist: 30
    freq: 10
    F_threshold: 1.0
    show_track: 1
    flow_back: 1
    max_solver_time: 0.04
    max_num_iterations: 8
    keyframe_parallax: 10.0
    acc_n: 0.1
    gyr_n: 0.01
    acc_w: 0.001
    gyr_w: 0.0001
    g_norm: 9.81
    estimate_td: 1
    td: 0.0
    load_previous_pose_graph: 0
    pose_graph_save_path: "./output/pose_graph/"
    save_image: 1
